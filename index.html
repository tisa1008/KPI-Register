<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放射師 KPI 申報表</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; scroll-behavior: smooth; }
        .dynamic-section { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f0f4f3; }
        ::-webkit-scrollbar-thumb { background: #b8c9c3; border-radius: 4px; }
        .theme-bg { background-color: #f0f4f3; }
        .theme-card { background-color: #ffffff; }
        .theme-text-main { color: #2d4a41; }
        .theme-text-sub { color: #5c7a6f; }
        .theme-input-bg { background-color: #fbfcfc; }
        .theme-input-border { border-color: #dce5e2; }
        .theme-primary { background-color: #528a7a; }
        .theme-primary-hover:hover { background-color: #437365; }
        .theme-ring:focus { box-shadow: 0 0 0 2px #8ab8a8; border-color: #528a7a; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="theme-bg p-4 md:p-8 min-h-screen text-[#4a5568]">

    <div class="max-w-4xl mx-auto theme-card rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-[#eef2f0] overflow-hidden p-6 md:p-10 flex flex-col">
        
        <!-- 標題列 (已移除切換主管版按鈕，徹底將入口分離) -->
        <div class="flex items-center justify-between mb-5 border-b border-gray-100 pb-4">
            <h2 class="text-2xl font-bold theme-text-main tracking-wide">放射師 KPI 申報表</h2>
            <button type="button" onclick="document.getElementById('queryModal').classList.remove('hidden')" class="flex items-center text-sm bg-[#eef5f2] hover:bg-[#dfeee8] text-[#528a7a] font-medium px-4 py-2.5 rounded-xl transition-colors whitespace-nowrap shadow-sm">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"></path></svg>
                查詢紀錄
            </button>
        </div>

        <div class="mb-8 p-4 bg-[#f8faf9] rounded-xl border border-[#eef2f0] text-sm text-[#5c7a6f] flex items-start shadow-sm">
            <svg class="w-5 h-5 mr-2.5 flex-shrink-0 mt-0.5 text-[#528a7a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="leading-relaxed">新 KPI 人力申報表預計 2026.08 正式啟用，使用相關問題請聯繫行政組長處理。每月 2 日結束後統計上月份紀錄，請記得登記。</p>
        </div>

        <form id="kpiForm" class="grid grid-cols-1 lg:grid-cols-2 gap-x-12 gap-y-6 flex-grow">
            <!-- 左欄：基本資料 -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium theme-text-sub mb-1.5">員工編號 <span class="text-[#c95d5d]">*</span></label>
                    <input type="text" id="empId" name="empId" required placeholder="請輸入 5 碼員編" class="w-full border theme-input-border rounded-xl px-4 py-2.5 outline-none theme-ring theme-input-bg transition-colors font-medium tracking-widest text-lg">
                    <div id="nameDisplayBox" class="hidden mt-2 p-3 bg-[#eef5f2] theme-text-main rounded-xl border border-[#d3e3dc] flex items-center shadow-sm">
                        <svg class="w-5 h-5 mr-2 text-[#528a7a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span class="font-medium">姓名：</span><span id="empName" class="ml-1 font-bold text-lg"></span>
                    </div>
                    <p id="empError" class="text-[#c95d5d] text-sm mt-2 hidden font-medium flex items-center"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>員編錯誤，請重新輸入。</p>
                </div>
                <div>
                    <label class="block text-sm font-medium theme-text-sub mb-1.5">日期 <span class="text-[#c95d5d]">*</span></label>
                    <input type="date" id="workDate" name="workDate" required class="w-full border theme-input-border rounded-xl px-4 py-2.5 outline-none theme-ring theme-input-bg transition-colors text-gray-700">
                </div>
                <div>
                    <label class="block text-sm font-medium theme-text-sub mb-2">實際申報時段(非班別) <span class="text-[#c95d5d]">*</span></label>
                    <div class="grid grid-cols-4 gap-2">
                        <label class="cursor-pointer"><input type="radio" name="workShift" value="AM" class="peer sr-only" required><div class="text-center border theme-input-border rounded-xl px-1 py-2.5 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors shadow-sm">AM</div></label>
                        <label class="cursor-pointer"><input type="radio" name="workShift" value="PM" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-1 py-2.5 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors shadow-sm">PM</div></label>
                        <label class="cursor-pointer"><input type="radio" name="workShift" value="17-21" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-1 py-2.5 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors shadow-sm">17-21</div></label>
                        <label class="cursor-pointer"><input type="radio" name="workShift" value="8-21" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-1 py-2.5 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors shadow-sm">8-21</div></label>
                        <label class="cursor-pointer"><input type="radio" name="workShift" value="B.D" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-1 py-2.5 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors shadow-sm">B、D班</div></label>
                        <label class="cursor-pointer"><input type="radio" name="workShift" value="G" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-1 py-2.5 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors shadow-sm">G</div></label>
                        <label class="cursor-pointer"><input type="radio" name="workShift" value="10-12" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-1 py-2.5 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors shadow-sm">10-12</div></label>
                        <label class="cursor-pointer"><input type="radio" name="workShift" value="10-17" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-1 py-2.5 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors shadow-sm">10-17</div></label>
                    </div>
                </div>
            </div>

            <!-- 右欄：工作細節 -->
            <div class="space-y-6 flex flex-col">
                <div>
                    <label class="block text-sm font-medium theme-text-sub mb-1.5">工作類別 <span class="text-[#c95d5d]">*</span></label>
                    <select id="category" name="category" required class="w-full border theme-input-border rounded-xl px-4 py-2.5 outline-none theme-ring theme-input-bg transition-colors text-gray-700">
                        <option value="" disabled selected>請選擇工作類別</option>
                        <option value="第二人力 (20點/時)">第二人力 (20點/時)</option>
                        <option value="支援 (20點/時)">支援 (20點/時)</option>
                        <option value="行政公務 (20點/時)">行政公務 (20點/時)</option>
                        <option value="教學公務 (20點/時)">教學公務 (20點/時)</option>
                        <option value="急診機動 (20點/時)">急診機動 (20點/時)</option>
                        <option value="臨床受訓 (15點/時)">臨床受訓 (15點/時)</option>
                        <option value="臨床教學-在職人員 (5點/時)">臨床教學-在職人員 (5點/時)</option>
                        <option value="臨床教學-實習生 (2.5點/時)">臨床教學-實習生 (2.5點/時)</option>
                    </select>
                    <div id="categoryDescBox" class="hidden mt-2 p-3 bg-[#fdfbf7] text-[#9c8466] rounded-xl border border-[#f2eadd] text-sm flex items-start shadow-sm">
                        <svg class="w-5 h-5 mr-2 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span id="categoryDescText" class="leading-relaxed"></span>
                    </div>
                </div>

                <div>
                    <div id="section-training" class="dynamic-section hidden bg-[#f8faf9] p-4 rounded-xl border border-[#eef2f0] shadow-sm">
                        <label class="block text-sm font-medium theme-text-sub mb-1.5">請填寫訓練區域 <span class="text-[#c95d5d]">*</span></label>
                        <input type="text" id="trainingArea" name="trainingArea" placeholder="輸入區域 (英文將自動轉大寫)" class="w-full border theme-input-border rounded-xl px-4 py-2.5 outline-none theme-ring bg-white">
                    </div>
                    <div id="section-support" class="dynamic-section hidden bg-[#f8faf9] p-4 rounded-xl border border-[#eef2f0] shadow-sm">
                        <div id="supportTextBlock">
                            <label class="block text-sm font-medium theme-text-sub mb-1.5">請填寫支援區域 <span class="text-[#c95d5d]">*</span></label>
                            <input type="text" id="supportArea" placeholder="輸入區域 (英文將自動轉大寫)" class="w-full border theme-input-border rounded-xl px-4 py-2.5 outline-none theme-ring bg-white">
                        </div>
                        <div id="secondManpowerBlock" class="hidden">
                            <label class="block text-sm font-medium theme-text-sub mb-2">請選擇支援機房 <span class="text-[#c95d5d]">*</span></label>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                <label class="cursor-pointer"><input type="radio" name="secondManpowerArea" value="ASRCT" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-2 py-2 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors">ASRCT</div></label>
                                <label class="cursor-pointer"><input type="radio" name="secondManpowerArea" value="MR1" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-2 py-2 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors">MR1</div></label>
                                <label class="cursor-pointer"><input type="radio" name="secondManpowerArea" value="病房" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-2 py-2 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors">病房</div></label>
                                <label class="cursor-pointer"><input type="radio" name="secondManpowerArea" value="其它" class="peer sr-only"><div class="text-center border theme-input-border rounded-xl px-2 py-2 text-sm font-medium theme-text-sub bg-white peer-checked:bg-[#528a7a] peer-checked:text-white transition-colors">其它</div></label>
                            </div>
                            <div id="supportAreaDescBox" class="hidden mt-3 p-3 bg-[#fdfbf7] text-[#9c8466] rounded-xl border border-[#f2eadd] text-sm flex items-start">
                                <span id="supportAreaDescText" class="leading-relaxed"></span>
                            </div>
                        </div>
                    </div>
                    <div id="section-official" class="dynamic-section hidden bg-[#f8faf9] p-4 rounded-xl border border-[#eef2f0] shadow-sm">
                        <label class="block text-sm font-medium theme-text-sub mb-3">任務來源 <span class="text-[#c95d5d]">*</span></label>
                        <div class="flex space-x-8">
                            <label class="flex items-center cursor-pointer group"><input type="radio" name="taskSource" value="主管指派" class="w-4 h-4 text-[#528a7a] focus:ring-[#528a7a] border-gray-300"><span class="ml-2 theme-text-main group-hover:text-[#528a7a] transition-colors">主管指派</span></label>
                            <label class="flex items-center cursor-pointer group"><input type="radio" name="taskSource" value="自行申請" class="w-4 h-4 text-[#528a7a] focus:ring-[#528a7a] border-gray-300"><span class="ml-2 theme-text-main group-hover:text-[#528a7a] transition-colors">自行申請</span></label>
                        </div>
                    </div>
                    <div id="section-mobile" class="dynamic-section hidden bg-[#f8faf9] p-4 rounded-xl border border-[#eef2f0] shadow-sm">
                        <label class="block text-sm font-medium theme-text-sub mb-3">機動班別 <span class="text-[#c95d5d]">*</span></label>
                        <div class="flex space-x-8">
                            <label class="flex items-center cursor-pointer group"><input type="radio" name="shift" value="白班" class="w-4 h-4 text-[#528a7a] focus:ring-[#528a7a] border-gray-300"><span class="ml-2 theme-text-main group-hover:text-[#528a7a] transition-colors">白班</span></label>
                            <label class="flex items-center cursor-pointer group"><input type="radio" name="shift" value="小夜" class="w-4 h-4 text-[#528a7a] focus:ring-[#528a7a] border-gray-300"><span class="ml-2 theme-text-main group-hover:text-[#528a7a] transition-colors">小夜</span></label>
                            <label class="flex items-center cursor-pointer group"><input type="radio" name="shift" value="大夜" class="w-4 h-4 text-[#528a7a] focus:ring-[#528a7a] border-gray-300"><span class="ml-2 theme-text-main group-hover:text-[#528a7a] transition-colors">大夜</span></label>
                        </div>
                    </div>
                </div>

                <div class="mt-auto pt-2">
                    <label class="block text-sm font-medium theme-text-sub mb-1.5">申報時數 (請以 0.5 為單位) <span class="text-[#c95d5d]">*</span></label>
                    <div class="flex items-center gap-2">
                        <button type="button" id="hoursMinusBtn" class="flex-shrink-0 w-11 h-11 flex items-center justify-center rounded-xl border theme-input-border bg-white text-[#528a7a] text-xl font-bold hover:bg-[#eef5f2] active:scale-95 transition-all shadow-sm">−</button>
                        <input type="number" id="hours" name="hours" step="0.5" min="0.5" required placeholder="例如: 0.5, 1.0" value="4" class="w-full text-center border theme-input-border rounded-xl px-4 py-2.5 outline-none theme-ring theme-input-bg transition-colors text-gray-700 shadow-sm">
                        <button type="button" id="hoursPlusBtn" class="flex-shrink-0 w-11 h-11 flex items-center justify-center rounded-xl border theme-input-border bg-white text-[#528a7a] text-xl font-bold hover:bg-[#eef5f2] active:scale-95 transition-all shadow-sm">+</button>
                    </div>
                    <p id="hoursError" class="text-[#c95d5d] text-sm mt-2 hidden font-medium flex items-center"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>時數格式錯誤！請輸入 0.5 的倍數。</p>
                    <p id="autoHoursHint" class="hidden text-[#528a7a] text-xs mt-2 font-medium">✓ 已依「班別＋支援機房」自動帶入建議時數，如有需要仍可手動調整。</p>
                </div>
            </div>

            <!-- 底部橫跨雙欄 -->
            <div class="lg:col-span-2 border-t border-gray-100 pt-6 mt-2">
                <div class="mb-6">
                    <label class="block text-sm font-medium theme-text-sub mb-1.5">
                        其他備註 <span id="notesOptionalText" class="text-gray-400 text-xs ml-1 font-normal">(選填)</span>
                        <span id="notesRequiredStar" class="text-[#c95d5d] hidden">*</span>
                    </label>
                    <textarea id="notes" name="notes" rows="2" class="w-full border theme-input-border rounded-xl px-4 py-3 outline-none theme-ring theme-input-bg transition-colors resize-none shadow-sm" placeholder="若有其他說明請填寫於此..."></textarea>
                </div>
                <div class="flex justify-center">
                    <button type="submit" id="submitBtn" class="w-full max-w-md theme-primary text-white font-bold py-3.5 px-4 rounded-xl theme-primary-hover transition duration-300 shadow-md tracking-wide text-lg flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        送出申報
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- 成功小視窗 -->
    <div id="successModal" class="fixed inset-0 bg-[#1a2b25] bg-opacity-40 backdrop-blur-sm hidden flex items-center justify-center z-50 px-4 transition-opacity">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl transform transition-all text-center">
            <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-[#eef5f2] mb-5">
                <svg class="h-7 w-7 text-[#528a7a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="text-xl font-bold theme-text-main">申報成功</h3>
            <p class="text-sm text-gray-500 mt-2 mb-8">感謝您的填寫，資料已順利送出。</p>
            <button id="btnContinue" class="w-full theme-primary text-white font-medium py-3 rounded-xl theme-primary-hover transition duration-200">
                繼續填寫下一筆
            </button>
        </div>
    </div>

    <!-- ★ 全新攔截：重複確認視窗 -->
    <div id="duplicateModal" class="fixed inset-0 bg-[#1a2b25] bg-opacity-40 backdrop-blur-sm hidden flex items-center justify-center z-[60] px-4 transition-opacity">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl transform transition-all text-center">
            <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-[#fef3c7] mb-5">
                <svg class="h-7 w-7 text-[#d97706]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-[#d97706] mb-3">發現重複資料</h3>
            <p class="text-sm text-gray-600 mb-6 leading-relaxed">
                系統發現您在<strong class="text-gray-800">該日</strong>已經有<strong class="text-gray-800">相同班別與類別</strong>的申報。<br><br>若這是不同時段的支援，請點擊「強制送出」；若為不小心選錯日期，請點擊「返回修改」。
            </p>
            <div class="flex flex-col space-y-3">
                <button type="button" onclick="closeDuplicateModal()" class="w-full bg-white border-2 border-gray-300 text-gray-600 font-medium py-3 rounded-xl hover:bg-gray-50 transition duration-200">
                    返回修改 (取消送出)
                </button>
                <button type="button" onclick="executeForceSubmit()" class="w-full bg-[#d97706] text-white font-medium py-3 rounded-xl hover:bg-[#b45309] transition duration-200 shadow-sm flex justify-center items-center">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    確認無誤，強制送出
                </button>
            </div>
        </div>
    </div>

    <!-- 查詢紀錄視窗 -->
    <div id="queryModal" class="fixed inset-0 bg-[#1a2b25] bg-opacity-40 backdrop-blur-sm hidden flex items-center justify-center z-50 px-4 transition-opacity">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl transform transition-all">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold theme-text-main">查詢申報紀錄</h3>
                <button type="button" onclick="document.getElementById('queryModal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <p class="text-sm text-gray-500 mb-6">可直接查詢並寄送至您的信箱</p>
            <div class="mb-4">
                <label class="block text-sm font-medium theme-text-sub mb-1.5">員工編號</label>
                <input type="text" id="mainQueryEmpId" placeholder="5碼員編" class="w-full border theme-input-border rounded-xl px-4 py-2.5 outline-none theme-ring theme-input-bg transition-colors">
                <p id="mainQueryEmpNameDisplay" class="text-sm text-[#528a7a] mt-1.5 hidden font-medium flex items-center"><span></span></p>
                <p id="mainQueryEmpError" class="text-[#c95d5d] text-sm mt-1.5 hidden font-medium flex items-center">員編錯誤，請重新輸入。</p>
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium theme-text-sub mb-1.5">查詢月份</label>
                <input type="month" id="mainQueryMonth" required class="w-full border theme-input-border rounded-xl px-4 py-2.5 outline-none theme-ring theme-input-bg transition-colors text-gray-700">
            </div>
            <button id="btnMainSendQuery" class="w-full bg-[#4a7c6b] text-white px-4 py-3 rounded-xl hover:bg-[#3d6658] transition duration-200 font-medium flex justify-center items-center">送出查詢信件</button>
        </div>
    </div>

    <script>
        // ★ 請確認此處為您最新的 GAS 網址
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxNBbuRgRi2QUC6PEpklFT1CuoLg4Ovan__ChG8LW2rRlS6tPu1wrNkZOktq-1O7ikBDg/exec';
        const EMPLOYEE_API_URL = 'https://script.google.com/macros/s/AKfycbxN266G9nOteMtxxHnhhhlodNF1eYEgNS0_9PTj4QziSzOM3RvjiiM3DfMYn0RtUndf/exec';

        function setDefaultDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('workDate').value = `${yyyy}-${mm}-${dd}`;
            document.getElementById('mainQueryMonth').value = `${yyyy}-${mm}`;
        }

        let employeeData = {};
        let isEmployeeDataLoaded = false;

        async function loadEmployeeData() {
            try {
                const response = await fetch(`${EMPLOYEE_API_URL}?action=getEmployees`);
                const result = await response.json();
                if (result.success) {
                    employeeData = result.data;
                    isEmployeeDataLoaded = true;
                    if(document.getElementById('empId').value) document.getElementById('empId').dispatchEvent(new Event('input'));
                }
            } catch (error) { console.error('員工資料載入失敗：', error); }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            setDefaultDate();
            await loadEmployeeData();
        });

        const categoryDescriptions = {
            "臨床教學-在職人員 (5點/時)": "臨床教學(在職訓練、PGY、代訓...)，請註記訓練機房。", "臨床教學-實習生 (2.5點/時)": "臨床教學(實習生)時填報，請註記訓練機房。",
            "臨床受訓 (15點/時)": "臨床受訓人員點值補充(在職訓練、PGY)。", "第二人力 (20點/時)": "雙人作業機房（ASRCT、MR1、病房）點值補充，「獨立作業時間」請勿申報。",
            "支援 (20點/時)": "支援非雙人作業機房點值補充。", "行政公務 (20點/時)": "行政公務點值補充；含有行政職位或賦予行政業務者，可選擇【自行申請】。",
            "教學公務 (20點/時)": "教學公務點值補充；含有教學職位或賦予教學業務者，可選擇【自行申請】。", "急診機動 (20點/時)": "急診區4人以上作業時填報點值補充。"
        };
        const hoursAutoRules = { "病房": { "AM": 2, "PM": 2 }, "ASRCT": { "AM": 3, "PM": 4, "B.D": 7, "10-12": 1, "10-17": 5 }, "MR1": { "AM": 2, "PM": 1.5, "B.D": 3.5, "17-21": 2, "8-21": 5.5, "G": 3.5 } };

        const empIdInput = document.getElementById('empId');
        const nameDisplayBox = document.getElementById('nameDisplayBox');
        const empNameSpan = document.getElementById('empName');
        const empError = document.getElementById('empError');
        let isEmpValid = false;

        empIdInput.addEventListener('input', function() {
            let id = this.value.trim().toUpperCase();
            this.value = id; 
            if (id === '') { nameDisplayBox.classList.add('hidden'); empError.classList.add('hidden'); isEmpValid = false; return; }
            if (employeeData[id]) {
                empNameSpan.textContent = employeeData[id];
                nameDisplayBox.classList.remove('hidden'); empError.classList.add('hidden'); isEmpValid = true;
            } else {
                nameDisplayBox.classList.add('hidden'); empError.classList.remove('hidden'); isEmpValid = false;
            }
        });

        const hoursInput = document.getElementById('hours');
        hoursInput.addEventListener('input', function() {
            const val = parseFloat(this.value);
            if (this.value !== '' && (isNaN(val) || val % 0.5 !== 0 || val <= 0)) document.getElementById('hoursError').classList.remove('hidden');
            else document.getElementById('hoursError').classList.add('hidden');
        });

        document.getElementById('hoursMinusBtn').addEventListener('click', () => adjustHours(-0.5));
        document.getElementById('hoursPlusBtn').addEventListener('click', () => adjustHours(0.5));
        function adjustHours(delta) {
            let val = parseFloat(hoursInput.value); if (isNaN(val)) val = 0;
            val = Math.round((val + delta) * 10) / 10; if (val < 0.5) val = 0.5;
            hoursInput.value = val; hoursInput.dispatchEvent(new Event('input'));
        }

        function getSelectedShift() { return document.querySelector('input[name="workShift"]:checked')?.value || ''; }

        const categorySelect = document.getElementById('category');
        const sections = { training: document.getElementById('section-training'), support: document.getElementById('section-support'), official: document.getElementById('section-official'), mobile: document.getElementById('section-mobile') };
        const supportTextBlock = document.getElementById('supportTextBlock'), secondManpowerBlock = document.getElementById('secondManpowerBlock'), supportAreaInput = document.getElementById('supportArea');
        const secondManpowerRadios = document.querySelectorAll('input[name="secondManpowerArea"]');

        document.getElementById('trainingArea').addEventListener('input', e => e.target.value = e.target.value.toUpperCase());
        supportAreaInput.addEventListener('input', e => e.target.value = e.target.value.toUpperCase());

        function calculateSecondManpowerHours() {
            if (categorySelect.value !== '第二人力 (20點/時)') return;
            const shift = getSelectedShift(), checkedRadio = document.querySelector('input[name="secondManpowerArea"]:checked');
            const area = checkedRadio ? checkedRadio.value : '';
            let autoHours = 4;
            if (area && hoursAutoRules[area] && hoursAutoRules[area][shift] !== undefined) {
                autoHours = hoursAutoRules[area][shift];
                document.getElementById('autoHoursHint').classList.remove('hidden');
            } else { document.getElementById('autoHoursHint').classList.add('hidden'); }
            hoursInput.value = autoHours; hoursInput.dispatchEvent(new Event('input'));
        }

        document.querySelectorAll('input[name="workShift"]').forEach(radio => radio.addEventListener('change', calculateSecondManpowerHours));
        secondManpowerRadios.forEach(radio => radio.addEventListener('change', calculateSecondManpowerHours));

        function hideAllSections() {
            Object.values(sections).forEach(sec => {
                sec.classList.add('hidden');
                sec.querySelectorAll('input[type="text"], input[type="radio"]').forEach(input => {
                    input.required = false; if (input.type === 'radio') input.checked = false; else input.value = '';
                });
            });
            supportTextBlock.classList.remove('hidden'); secondManpowerBlock.classList.add('hidden'); document.getElementById('autoHoursHint').classList.add('hidden');
        }

        categorySelect.addEventListener('change', function() {
            hideAllSections(); const val = this.value;
            if (categoryDescriptions[val]) {
                document.getElementById('categoryDescText').textContent = categoryDescriptions[val];
                document.getElementById('categoryDescBox').classList.remove('hidden');
            } else { document.getElementById('categoryDescBox').classList.add('hidden'); }

            if (val.includes('臨床教學') || val === '臨床受訓 (15點/時)') {
                sections.training.classList.remove('hidden'); document.getElementById('trainingArea').required = true;
            } else if (val === '第二人力 (20點/時)') {
                sections.support.classList.remove('hidden'); supportTextBlock.classList.add('hidden'); secondManpowerBlock.classList.remove('hidden');
                secondManpowerRadios.forEach(r => r.required = true); calculateSecondManpowerHours(); 
            } else if (val === '支援 (20點/時)') {
                sections.support.classList.remove('hidden'); secondManpowerBlock.classList.add('hidden'); supportTextBlock.classList.remove('hidden'); supportAreaInput.required = true;
            } else if (val.includes('公務')) {
                sections.official.classList.remove('hidden'); sections.official.querySelectorAll('input[type="radio"]').forEach(r => r.required = true);
                const supervisorAssignedRadio = sections.official.querySelector('input[value="主管指派"]'); if (supervisorAssignedRadio) supervisorAssignedRadio.checked = true;
            } else if (val === '急診機動 (20點/時)') {
                sections.mobile.classList.remove('hidden'); sections.mobile.querySelectorAll('input[type="radio"]').forEach(r => r.required = true);
            }
            checkNotesRequired();
        });

        const notesInput = document.getElementById('notes');
        function checkNotesRequired() {
            let isSelfApplied = false;
            document.querySelectorAll('input[name="taskSource"]').forEach(radio => { if (radio.checked && radio.value === '自行申請') isSelfApplied = true; });
            if ((categorySelect.value.includes('公務')) && isSelfApplied) {
                notesInput.required = true; document.getElementById('notesRequiredStar').classList.remove('hidden'); document.getElementById('notesOptionalText').classList.add('hidden');
                notesInput.placeholder = "您選擇了「自行申請」，請務必在此填寫事由說明..."; notesInput.classList.add('bg-[#fffbf0]', 'border-[#f2eadd]');
            } else {
                notesInput.required = false; document.getElementById('notesRequiredStar').classList.add('hidden'); document.getElementById('notesOptionalText').classList.remove('hidden');
                notesInput.placeholder = "若有其他說明請填寫於此..."; notesInput.classList.remove('bg-[#fffbf0]', 'border-[#f2eadd]');
            }
        }
        document.querySelectorAll('input[name="taskSource"]').forEach(radio => radio.addEventListener('change', checkNotesRequired));

        document.getElementById('btnContinue').addEventListener('click', () => {
            document.getElementById('successModal').classList.add('hidden');
            resetFormToDefault(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function resetFormToDefault(keepEmpId = false) {
            const currentEmpId = empIdInput.value; 
            document.getElementById('kpiForm').reset();
            setDefaultDate();
            document.getElementById('hours').value = '4'; 
            hideAllSections();
            document.getElementById('categoryDescBox').classList.add('hidden');
            checkNotesRequired();
            if (keepEmpId && currentEmpId) {
                empIdInput.value = currentEmpId; empIdInput.dispatchEvent(new Event('input'));
            } else {
                nameDisplayBox.classList.add('hidden'); isEmpValid = false;
            }
        }

        // 查詢信件寄送
        const mainQueryEmpIdInput = document.getElementById('mainQueryEmpId');
        mainQueryEmpIdInput.addEventListener('input', function() {
            let id = this.value.trim().toUpperCase(); this.value = id;
            if (id === '') { document.getElementById('mainQueryEmpNameDisplay').classList.add('hidden'); document.getElementById('mainQueryEmpError').classList.add('hidden'); return; }
            if (employeeData[id]) {
                document.getElementById('mainQueryEmpNameDisplay').querySelector('span').textContent = `查詢對象：${employeeData[id]}`;
                document.getElementById('mainQueryEmpNameDisplay').classList.remove('hidden'); document.getElementById('mainQueryEmpError').classList.add('hidden');
            } else {
                document.getElementById('mainQueryEmpNameDisplay').classList.add('hidden'); document.getElementById('mainQueryEmpError').classList.remove('hidden');
            }
        });

        document.getElementById('btnMainSendQuery').addEventListener('click', async () => {
            if (!employeeData[mainQueryEmpIdInput.value.toUpperCase()]) return document.getElementById('mainQueryEmpError').classList.remove('hidden');
            const month = document.getElementById('mainQueryMonth').value; if (!month) return alert('請選擇查詢月份！');
            
            const btn = document.getElementById('btnMainSendQuery'); const originalText = btn.innerText;
            btn.disabled = true; btn.innerText = '寄送中...'; btn.classList.add('opacity-70');
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'query', empId: mainQueryEmpIdInput.value, month: month }) });
                const result = await response.json();
                if (result.success) { alert(result.message); document.getElementById('queryModal').classList.add('hidden'); mainQueryEmpIdInput.value = ''; } 
                else { alert('查詢失敗：' + result.message); }
            } catch (error) { alert('網路錯誤請稍後再試。'); } 
            finally { btn.disabled = false; btn.innerText = originalText; btn.classList.remove('opacity-70'); }
        });

        // ================= ★ 議題二：防呆送出與攔截邏輯 =================
        let pendingSubmitData = null; // 暫存要準備送出的資料

        document.getElementById('kpiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!isEmployeeDataLoaded) return alert('員工資料尚未載入完成，請稍候。');
            if (!isEmpValid) { empIdInput.focus(); empError.classList.remove('hidden'); return; }
            const hoursVal = parseFloat(hoursInput.value);
            if (isNaN(hoursVal) || hoursVal % 0.5 !== 0 || hoursVal <= 0) { hoursInput.focus(); document.getElementById('hoursError').classList.remove('hidden'); return; }
            if (!getSelectedShift()) return alert('請選擇申報班別！');

            // 收集資料包
            const formData = new FormData(this);
            const categoryValue = formData.get('category');
            let supportAreaValue = '';
            if (categoryValue === '第二人力 (20點/時)') {
                const checkedRadio = document.querySelector('input[name="secondManpowerArea"]:checked');
                supportAreaValue = checkedRadio ? checkedRadio.value : '';
            } else if (categoryValue === '支援 (20點/時)') {
                supportAreaValue = document.getElementById('supportArea').value;
            }
            
            pendingSubmitData = {
                action: 'submit',
                forceSubmit: false, // 第一次預設不強制
                data: {
                    workDate: formData.get('workDate'), workShift: getSelectedShift(), 
                    empId: formData.get('empId').toUpperCase(), empName: employeeData[formData.get('empId').toUpperCase()],
                    category: categoryValue, hours: formData.get('hours'), trainingArea: formData.get('trainingArea'),
                    supportArea: supportAreaValue, taskSource: formData.get('taskSource'), shift: formData.get('shift'), notes: formData.get('notes')
                }
            };

            sendDataToBackend(pendingSubmitData);
        });

        async function sendDataToBackend(payload) {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true; submitBtn.innerText = '資料傳送中...'; submitBtn.classList.replace('theme-primary', 'bg-[#b8c9c3]');

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();

                if (data.success) {
                    document.getElementById('duplicateModal').classList.add('hidden');
                    document.getElementById('successModal').classList.remove('hidden');
                } else if (data.requireConfirmation) {
                    // ★ 被後端攔截，跳出確認視窗
                    document.getElementById('duplicateModal').classList.remove('hidden');
                } else {
                    throw new Error(data.message || "未知錯誤");
                }
            } catch (error) {
                console.error('Error:', error);
                alert('伺服器無回應，請重新整理確認。');
            } finally {
                submitBtn.disabled = false; submitBtn.innerText = '送出申報'; submitBtn.classList.replace('bg-[#b8c9c3]', 'theme-primary');
            }
        }

        // 確認視窗按鈕行為
        function closeDuplicateModal() {
            document.getElementById('duplicateModal').classList.add('hidden');
            pendingSubmitData = null; // 取消送出
        }

        function executeForceSubmit() {
            if (pendingSubmitData) {
                pendingSubmitData.forceSubmit = true; // 加上強力過關標記
                sendDataToBackend(pendingSubmitData);
                document.getElementById('duplicateModal').classList.add('hidden'); // 先關閉視窗，按鈕狀態會由 sendDataToBackend 處理
            }
        }
    </script>
</body>
</html>
